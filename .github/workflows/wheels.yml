# Builds the sdist and wheel and uploads them with PyPI trusted publishing.
# A push to the test-publish branch uploads to TestPyPI, so a release can be
# tried out before it is tagged. Publishing a GitHub release uploads to PyPI.
# Both uploads need the "release" environment to exist in the repository
# settings and a matching trusted publisher on the index.
name: Publish Python release

on:
  push:
    branches: [test-publish]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          # setuptools_scm needs the tags to work out the version.
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - name: Check the built distributions
        run: |
          ls -l dist/
          uv run --no-project --with twine twine check dist/*

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    runs-on: ubuntu-24.04
    environment: release
    needs: [build]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish to TestPyPI
        if: github.event_name == 'push' && github.ref_name == 'test-publish'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

      - name: Publish to PyPI
        if: github.event_name == 'release'
        uses: pypa/gh-action-pypi-publish@v1.14.2
