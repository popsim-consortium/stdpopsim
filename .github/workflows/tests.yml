name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}
      # Which SLiM to test against; see .github/actions/install-slim.
      # Leave SLIM_VERSION empty to build SLiM from github, which is needed
      # while the code depends on unreleased SLiM features. Set it to a
      # released version, for example "5.2", to install that release from
      # conda-forge instead. Do that once the next SLiM release is out.
      SLIM_VERSION: ""
      # Git branch to build when SLIM_VERSION is empty. Leave empty for
      # SLiM's default branch.
      SLIM_BRANCH: ""
      # Increase this to rebuild SLiM from a newer github head.
      SLIM_CACHE_NUM: 1
    steps:
      - name: cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install test deps
        run: uv sync --locked --group test --no-default-groups

      - name: Install SLiM
        uses: ./.github/actions/install-slim
        with:
          version: ${{ env.SLIM_VERSION }}
          branch: ${{ env.SLIM_BRANCH }}
          cache-number: ${{ env.SLIM_CACHE_NUM }}

      - name: run test suite
        run: |
          uv run --locked --group test --no-default-groups \
            pytest \
            -n 0 \
            -v \
            --cov=stdpopsim \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            tests

      - name: upload coverage report to codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          fail_ci_if_error: true
          env_vars: OS,PYTHON
          # Use upload token to avoid upload failures.
          # https://github.com/codecov/codecov-action/issues/837
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
