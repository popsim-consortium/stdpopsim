name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}
      # SLiM is not on PyPI, so it does not come from uv.lock. Leave
      # SLIM_VERSION empty to build SLiM from github head, which is needed
      # while the code depends on unreleased SLiM features. Set it to a
      # released version, for example "5.2", to install that release from
      # conda-forge instead. Do that once the next SLiM release is out.
      SLIM_VERSION: ""
      # Increase this to rebuild SLiM from a newer github head. Only the
      # slim binary is cached, keyed on the runner and this number.
      SLIM_CACHE_NUM: 1
    steps:
      - name: cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: checkout
        uses: actions/checkout@v4.2.2

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true

      - name: Install test deps
        run: uv sync --locked --group test --no-default-groups

      - name: Install released SLiM from conda-forge
        if: env.SLIM_VERSION != ''
        uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-name: slim
          create-args: slim=${{ env.SLIM_VERSION }}
          init-shell: none

      - name: Add released SLiM to PATH
        if: env.SLIM_VERSION != ''
        # conda-forge puts the binary under bin/ on Linux and macOS and
        # under Library/bin/ on Windows.
        run: |
          echo "$MAMBA_ROOT_PREFIX/envs/slim/bin" >> $GITHUB_PATH
          echo "$MAMBA_ROOT_PREFIX/envs/slim/Library/bin" >> $GITHUB_PATH

      - name: Cache SLiM binary
        if: env.SLIM_VERSION == ''
        id: cache-slim
        uses: actions/cache@v4.2.0
        with:
          path: SLiM/Release/slim*
          key: slim-${{ runner.os }}-${{ runner.arch }}-${{ env.SLIM_CACHE_NUM }}

      - name: Build development SLiM (Linux, macOS)
        if: env.SLIM_VERSION == '' && runner.os != 'Windows' && steps.cache-slim.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/messerlab/SLiM.git
          mkdir -p SLiM/Release
          cd SLiM/Release
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j 2

      - name: Set up MSYS2 (Windows)
        if: env.SLIM_VERSION == '' && runner.os == 'Windows' && steps.cache-slim.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2.32.0
        with:
          msystem: UCRT64
          release: false
          install: >-
            git
            base-devel
            msys2-devel
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-autotools

      - name: Build development SLiM (Windows)
      # SLiM links its runtime statically on Windows, so the resulting
      # slim.exe runs from the plain bash shell used by the test step.
        if: env.SLIM_VERSION == '' && runner.os == 'Windows' && steps.cache-slim.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          git clone --depth 1 https://github.com/messerlab/SLiM.git
          cd SLiM/windows_compat/gnulib
          # The gnulib configure scripts must be newer than their inputs,
          # or the build tries to regenerate them with autotools.
          touch aclocal.m4 Makefile.am configure configure.ac config.h.in Makefile.in
          cd ../..
          mkdir -p Release
          cd Release
          cmake -G"MSYS Makefiles" -DCMAKE_BUILD_TYPE=Release ..
          make -j 2

      - name: run test suite
        run: |
          export PATH=$PWD/SLiM/Release:$PATH
          slim -v
          uv run --locked --group test --no-default-groups \
            pytest \
            -n 0 \
            -v \
            --cov=stdpopsim \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml \
            tests

      - name: upload coverage report to codecov
        uses: codecov/codecov-action@v7.0.0
        with:
          fail_ci_if_error: true
          env_vars: OS,PYTHON
          # Use upload token to avoid upload failures.
          # https://github.com/codecov/codecov-action/issues/837
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
