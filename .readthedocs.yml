# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  # Install uv and use it to populate the Read the Docs virtualenv from
  # the "docs" dependency group in pyproject.toml. The local package is
  # installed as part of `uv sync`, so stdpopsim is on the path for the
  # `command-output` directives in the docs.
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --group docs --no-default-groups

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true
